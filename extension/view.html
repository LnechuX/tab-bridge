<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tab Bridge — полученное</title>
  <link rel="stylesheet" href="common.css">
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 24px; height: 24px; }
    h1 { font-size: 20px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .actions .primary { padding: 10px 18px; }
    .stage { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .stage img { display: block; max-width: 100%; max-height: 75vh; margin: 0 auto; border-radius: 6px; }
    .stage pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #msg { min-height: 20px; margin: 10px 0 0; }
  </style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1 id="title">Загрузка…</h1>
  </header>
  <div class="meta" id="meta"></div>
  <div class="actions" id="actions"></div>
  <div class="stage" id="stage" hidden></div>
  <div id="msg" role="status"></div>
</main>
<script src="blobstore.js"></script>
<script src="view.js"></script>
</body>
</html>
