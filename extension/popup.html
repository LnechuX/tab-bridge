<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tab Bridge</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 360px; max-width: 100%; padding: 14px; }
    body.full { width: auto; max-width: 620px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; align-items: center; gap: 8px; }
    header img { width: 22px; height: 22px; }
    header .name { font-weight: 600; flex: 1; }
    .lock { font-size: 11px; color: var(--ok); margin: 2px 0 12px 30px; }
    .page { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
    .page .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page .h { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #targets { display: grid; gap: 8px; }
    #targets button { width: 100%; padding: 12px; font-size: 15px; text-align: left; display: flex; align-items: center; gap: 10px; }
    #targets button .ic { font-size: 18px; }
    #targets button .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #targets .all { justify-content: center; font-size: 14px; padding: 9px; }
    #targets button:not(.primary) .nm { font-weight: 500; }
    .empty-box { text-align: center; padding: 6px 0 2px; }
    .empty-box p { margin: 0 0 10px; }
    #status { min-height: 18px; margin: 8px 0 2px; font-size: 13px; overflow-wrap: anywhere; }
    .tabs { display: flex; gap: 4px; margin: 12px 0 6px; border-bottom: 1px solid var(--line); }
    .tabs button { border: 0; background: none; border-radius: 0; padding: 6px 8px; color: var(--muted); font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 7px 4px; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .m { display: block; font-size: 12px; color: var(--muted); }
    li a { color: var(--text); text-decoration: none; }
    li a:hover .t { text-decoration: underline; }
    .st-opened { color: var(--ok); }
    .st-delivered { color: var(--accent); }
    .none { padding: 8px 4px; }
    footer { display: flex; justify-content: space-between; margin-top: 10px; gap: 8px; }
    footer button { flex: 1; font-size: 13px; padding: 7px 8px; }
    .small-note { margin-top: 8px; font-size: 11px; }
    .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; cursor: pointer; }
    .warn-box { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); font-size: 12px; display: flex; gap: 8px; align-items: start; }
    .warn-box span { flex: 1; }
    .warn-box .x { background: none; border: 0; padding: 0 2px; color: inherit; }
    .retry { margin-top: 4px; font-size: 12px; padding: 3px 8px; }
    .compose { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .compose summary { cursor: pointer; font-size: 13px; font-weight: 600; }
    .compose textarea { width: 100%; margin-top: 8px; font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); resize: vertical; }
    .compose-row { display: flex; gap: 6px; margin-top: 6px; }
    .compose-row select { flex: 1; min-width: 0; font: inherit; font-size: 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
    .compose-row .primary { flex: 1; }
    .full-row { display: block; font-size: 12px; margin-top: 6px; color: var(--muted, #888); }
    .full-row[hidden] { display: none; }
    .attach-info { font-size: 13px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <span class="name">Tab Bridge</span>
    <span class="muted" id="me"></span>
  </header>
  <div class="lock">🔒 Сквозное шифрование</div>

  <div id="sendBox">
    <div class="page" id="page" hidden><div class="t" id="pageTitle"></div><div class="h" id="pageHost"></div></div>
    <div id="targets"></div>
    <div id="status" role="status"></div>
    <details class="compose" id="compose">
      <summary>✏️ Отправить текст или картинку</summary>
      <textarea id="composeText" rows="3" placeholder="Напишите текст или вставьте скриншот (Ctrl+V)"></textarea>
      <div class="attach-info" id="attachInfo" hidden>🖼 <span id="attachName"></span> <button class="link" id="attachClear">убрать</button></div>
      <label class="full-row" id="fullRow" hidden><input type="checkbox" id="fullQuality"> Без сжатия (исходное качество, дольше)</label>
      <div class="compose-row">
        <button id="attachBtn" title="Выбрать файл или картинку">📎 Файл</button>
        <select id="composeTo" hidden aria-label="Куда отправить"></select>
        <button id="composeSend" class="primary" disabled>Отправить</button>
      </div>
      <input type="file" id="fileInput" hidden>
    </details>
  </div>

  <div class="warn-box" id="warn" hidden><span id="warnText"></span> <button class="x" id="warnClose" title="Скрыть">✕</button></div>

  <div class="tabs">
    <button id="tabSent" class="on">Отправлено</button>
    <button id="tabRecv">Получено</button>
  </div>
  <ul id="list"></ul>
  <div id="none" class="muted none" hidden></div>

  <footer>
    <button id="full">Вся история</button>
    <button id="settings">Устройства и настройки</button>
  </footer>
  <div class="muted small-note" id="hint" hidden>Можно отправлять сразу по клику на значок, без этого окна — <button class="link" id="hintLink">включить в настройках</button></div>
  <div class="muted small-note" id="last"></div>

  <script src="shrink.js"></script>
  <script src="popup.js"></script>
</body>
</html>
